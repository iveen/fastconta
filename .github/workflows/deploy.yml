name: CD - Despliegue a Oracle Cloud
on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Desplegar a producción
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Verificar secrets configurados
        run: |
          if [ -z "${{ secrets.ORACLE_HOST }}" ]; then echo "❌ ORACLE_HOST no configurado"; exit 1; fi
          if [ -z "${{ secrets.ORACLE_USER }}" ]; then echo "❌ ORACLE_USER no configurado"; exit 1; fi
          if [ -z "${{ secrets.ORACLE_SSH_KEY }}" ]; then echo "❌ ORACLE_SSH_KEY no configurado"; exit 1; fi
          echo "✅ Todos los secrets están configurados"

      - name: Desplegar vía SSH a Oracle Cloud
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DB_USER: fastconta_user
          DB_NAME: fastconta_data
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: TG_TOKEN,TG_CHAT_ID,DB_USER,DB_NAME
          script: |
            set -e
            cd /opt/fastconta
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)

            if [ ! -f .env ]; then
              echo "❌ Archivo .env no encontrado"
              curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                -d chat_id="${TG_CHAT_ID}" \
                -d text="❌ *FastConta Deploy FALLIDO*%0A%0A📅 ${TIMESTAMP}%0A🔍 Motivo: Archivo .env no encontrado" \
                -d parse_mode="Markdown" > /dev/null || true
              exit 1
            fi

            # ─── 📦 BACKUP DE BASE DE DATOS ───
            echo "📦 Creando backup de la base de datos..."
            mkdir -p /opt/fastconta/backups
            docker exec fastconta_db pg_dump -U ${DB_USER} -F c ${DB_NAME} > /opt/fastconta/backups/backup_${TIMESTAMP}.dump
            echo "✅ Backup DB creado: backup_${TIMESTAMP}.dump"

            # ─── 📦 BACKUP DE UPLOADS ───
            echo "📦 Creando backup de uploads..."
            UPLOADS_PATH=$(docker volume inspect fastconta_uploads_prod --format '{{ .Mountpoint }}' 2>/dev/null || echo "")
            if [ -n "${UPLOADS_PATH}" ] && [ -d "${UPLOADS_PATH}" ]; then
              tar -czf /opt/fastconta/backups/uploads_${TIMESTAMP}.tar.gz -C "${UPLOADS_PATH}" . 2>/dev/null || echo "⚠️ Uploads vacío o con errores"
              echo "✅ Backup uploads creado"
            else
              echo "⚠️ Volumen uploads_prod no encontrado, omitiendo backup"
            fi

            # ─── 🔄 OBTENER CAMBIOS ───
            echo "🔄 Obteniendo últimos cambios..."
            git fetch origin main
            git reset --hard origin/main

            # ─── 🔨 CONSTRUIR ───
            echo "🔨 Construyendo nuevas imágenes..."
            docker compose -f docker-compose.prod.yml build --pull

            # ─── 🚀 DESPLEGAR ───
            echo "🚀 Aplicando despliegue..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # ─── ✅ VERIFICAR ───
            echo "✅ Verificando estado..."
            sleep 10
            docker compose -f docker-compose.prod.yml ps

            echo "🏥 Health check del backend..."
            if curl -f -s http://localhost:8001/docs > /dev/null; then
              echo "✅ Backend respondiendo correctamente"
            else
              echo "⚠️ Backend no responde, mostrando logs..."
              docker compose -f docker-compose.prod.yml logs --tail=50 backend
              curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                -d chat_id="${TG_CHAT_ID}" \
                -d text="❌ *FastConta Deploy FALLIDO*%0A%0A📅 ${TIMESTAMP}%0A🔍 Motivo: Backend no responde (health check fallido)%0A%0A🔗 https://fastconta.serviciosdyg.com" \
                -d parse_mode="Markdown" > /dev/null || true
              exit 1
            fi

            # ─── 🧹 LIMPIEZA ───
            echo "🧹 Limpiando imágenes antiguas..."
            docker image prune -f

            echo "🧹 Limpiando backups antiguos (manteniendo últimos 7)..."
            ls -t /opt/fastconta/backups/backup_*.dump 2>/dev/null | tail -n +8 | xargs -r rm
            ls -t /opt/fastconta/backups/uploads_*.tar.gz 2>/dev/null | tail -n +8 | xargs -r rm

            # ─── 🔔 NOTIFICACIÓN ÉXITO ───
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d text="✅ *FastConta Deploy EXITOSO*%0A%0A📅 ${TIMESTAMP}%0A🔗 https://fastconta.serviciosdyg.com%0A💾 Backup: backup_${TIMESTAMP}.dump" \
              -d parse_mode="Markdown" > /dev/null || true

            echo "✅ Despliegue completado exitosamente"

      # ─── 🔔 NOTIFICACIÓN SI EL JOB FALLA EN GITHUB ───
      - name: Notificar fallo en GitHub
        if: failure() && steps.deploy.outcome == 'failure'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d text="❌ *FastConta Deploy FALLIDO*%0A%0A📅 ${TIMESTAMP}%0A🔍 Motivo: Error en el pipeline de GitHub Actions%0A🔗 https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -d parse_mode="Markdown" > /dev/null || true