name: CI - Frontend Validación

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'

jobs:
  frontend-ci:
    name: Node 22 - Vue + pnpm
    runs-on: ubuntu-latest
    
    # Define el directorio de trabajo una vez para todos los pasos "run"
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11 # Usa la versión que tu proyecto requiera (8, 9, etc.)
          run_install: false

      - name: Configurar Node.js y caché
        uses: actions/setup-node@v4
        with:
          node-version: '22' # LTS estable, evita warnings de deprecación de GitHub
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar build de producción
        run: pnpm run build