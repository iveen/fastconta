name: CI - Frontend Validación

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**' # ✅ Se activa con cualquier cambio dentro de la carpeta
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'

jobs:
  frontend-ci:
    name: Node 20 - Vue + pnpm
    runs-on: ubuntu-latest
    
    # ✅ Define el directorio de trabajo una vez para todos los pasos "run"
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js y caché de pnpm
        uses: actions/setup-node@v4
        with:
          # ✅ Node 20 es LTS y evita el warning de deprecación de GitHub Actions.
          # Si tu proyecto requiere Node 22, cámbialo a '22', pero '20' es el más estable actualmente.
          node-version: '20' 
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar build de producción
        run: pnpm run build