# backend/ruff.toml
line-length = 120
target-version = "py312"

[lint]
# Reglas que SÍ queremos que Ruff corrija automáticamente
select = [
    "E", "F", "W",      # Errores y warnings básicos de Python
    "I",                # Orden de imports
    "UP",               # Actualizaciones de sintaxis de Python (ej. datetime.UTC)
    "RUF",              # Reglas específicas de Ruff
    "FURB",             # Modernizaciones de código
]

# Reglas que IGNORAMOS porque son ruido en código legacy o requieren refactorización manual
ignore = [
    "RUF012", # Mutable default value (Muy común e inofensivo en modelos SQLAlchemy/Pydantic)
    "S110",   # try-except-pass (A veces es intencional en parsers)
    "ASYNC210", # Blocking HTTP calls in async (Requiere refactorización mayor, ignorar por ahora)
    "ASYNC230", # Blocking open() in async (Requiere refactorización mayor, ignorar por ahora)
    "PIE790", # Unnecessary pass statement
    "EXE001", # Shebang is present but file is not executable
]

[lint.per-file-ignores]
# Ignorar reglas específicas en carpetas de scripts o deprecated
"app/scripts/*" = ["E402", "EXE001"]
"app/services/deprecated/*" = ["ALL"]