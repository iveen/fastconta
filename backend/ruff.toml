# backend/ruff.toml
line-length = 120
target-version = "py312"

[lint]
# Solo habilitar reglas críticas
select = [
    "E",    # Errores de sintaxis
    "F",    # Errores de importación
    "W",    # Warnings críticos
]

# Ignorar reglas que causan ruido en código legacy
ignore = [
    "B008",    # Depends en argumentos (FastAPI lo usa así)
    "BLE001",  # Catch Exception genérico
    "UP006",   # Usar list en vez de List
    "UP017",   # Usar datetime.UTC
    "UP035",   # typing.List deprecated
    "RUF010",  # Conversion flags
    "RUF012",  # Mutable defaults (SQLAlchemy/Pydantic)
    "RUF100",  # Unused noqa
    "G201",    # Logging exception
    "RET501",  # Return None explícito
    "PLR1711", # Useless return
    "DTZ011",  # datetime.date.today()
    "DTZ003",  # datetime.datetime.utcnow()
    "UP045",   # X | None
    "SIM103",  # Return condition directly
    "PIE790",  # Unnecessary pass
    "EXE001",  # Shebang not executable
    "ASYNC210", # Blocking HTTP in async
    "ASYNC230", # Blocking open in async
    "S110",    # try-except-pass
    "TRY401",  # Redundant exception in logging
    "FURB157", # Verbose Decimal
    "RUF019",  # Unnecessary key check
    "RUF022",  # __all__ not sorted
    "PYI041",  # Use float instead of int | float
    "UP007",   # Use X | Y
    "I001",    # Import sorting (muy estricto)
    "E501",    # line too long
    "W291",    # trailing white-space
    "W293",    # Blank line contains whitespace
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"app/scripts/*" = ["E402", "EXE001"]
"app/scripts/data/*" = ["E501"]
"app/services/deprecated/*" = ["ALL"]