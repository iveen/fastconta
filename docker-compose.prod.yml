services:
  db:
    image: postgres:16-alpine
    container_name: fastconta_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-fastconta}
      POSTGRES_USER: ${DATABASE_USER:-fastconta}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-fastconta}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - fastconta_net

  # ──────────────────────────────────────────────
  # 🆕 Redis (broker + backend de Celery)
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fastconta_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - fastconta_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastconta_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # ⚠️ En prod, estos overrides apuntan a los servicios del compose
      DATABASE_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - uploads_prod:/app/uploads  # 🆕 Volumen compartido con worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fastconta_net
  # ──────────────────────────────────────────────
  # 🆕 Frontend (VueJS + Tailwind servido por Nginx)
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend  # Asegúrate de que esta carpeta exista con su Dockerfile
      dockerfile: Dockerfile
    container_name: fastconta_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"  # Mapea el puerto 80 del contenedor al 8082 del host (como espera tu Nginx)
    networks:
      - fastconta_net

  # ──────────────────────────────────────────────
  # 🆕 Celery Worker (FEL + Inventarios)
  # ──────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastconta_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - uploads_prod:/app/uploads  # ⚠️ DEBE coincidir con backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.core.celery_app worker
      --loglevel=warning
      --concurrency=4
      --max-tasks-per-child=50
      --hostname=worker@%h
      -Q fel,inventario,tenant,celery
    networks:
      - fastconta_net
    deploy:
      resources:
        limits:
          memory: 2G
  worker-email:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastconta_worker_email
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    command: >
      celery -A app.core.celery_app worker
      --loglevel=warning
      --concurrency=2
      --max-tasks-per-child=100
      --hostname=email-worker@%h
      -Q email
    networks:
      - fastconta_net
    deploy:
      resources:
        limits:
          memory: 512M

  # ──────────────────────────────────────────────
  # 🆕 Flower (monitoreo) — expuesto solo en localhost
  # ──────────────────────────────────────────────
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastconta_flower
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    ports:
      - "127.0.0.1:5555:5555"  # Solo accesible desde el servidor
    depends_on:
      redis:
        condition: service_healthy
    command: >
      celery -A app.core.celery_app flower
      --port=5555
      --broker_api=redis://redis:6379/0
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-changeme}
    networks:
      - fastconta_net

networks:
  fastconta_net:
    driver: bridge

volumes:
  pgdata:
  redis_data:        # 🆕
  uploads_prod:      # 🆕 Volumen compartido backend ↔ worker